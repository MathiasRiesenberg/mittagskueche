<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mittagsk&uuml;che">
<meta name="theme-color" content="#0f0f0f">
<title>Mittagsk&uuml;che</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0f0f0f;--bg2:#161616;--bg3:#1f1f1f;--line:#2a2a2a;--txt:#f0ece3;--mut:#888;--gold:#e8c87a;--red:#f87171;--grn:#86c98a}
body{background:var(--bg);color:var(--txt);font-family:Georgia,'Times New Roman',serif;min-height:100vh}
button,select,input,textarea{font-family:inherit;color:inherit}
.sans{font-family:-apple-system,system-ui,sans-serif}
#app{display:flex;flex-direction:column;min-height:100vh;padding-bottom:78px}
header{padding:18px 18px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:30}
.htop{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.htop h1{font-size:21px;font-weight:700;letter-spacing:-.5px}
.htop .em{font-size:25px}
main{flex:1;padding:18px 14px 24px}
.view{display:none}.view.active{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#121212;border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;padding:11px 4px 13px;cursor:pointer;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-family:-apple-system,sans-serif;position:relative}
nav button .ico{font-size:19px}
nav button.active{color:var(--gold)}
.nbadge{position:absolute;top:6px;margin-left:20px;background:var(--gold);color:#000;border-radius:9px;font-size:9px;font-weight:800;padding:0 5px;min-width:15px;text-align:center}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--gold);color:#000;border-radius:20px;padding:8px 18px;font-size:13px;font-weight:700;z-index:999;opacity:0;pointer-events:none;transition:opacity .2s;font-family:-apple-system,sans-serif}
#toast.show{opacity:1}
.lbl{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin:18px 0 9px;font-family:-apple-system,sans-serif}
.lbl:first-child{margin-top:0}
.wsum{background:linear-gradient(135deg,#1c1a14,#161616);border:1px solid #2e2a1f;border-radius:16px;padding:15px 16px;margin-bottom:6px}
.wsum .t{font-size:12px;color:var(--mut);font-family:-apple-system,sans-serif;margin-bottom:10px;display:flex;justify-content:space-between}
.wsum .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nstat{text-align:center}
.nstat .v{font-size:18px;font-weight:700;font-family:-apple-system,sans-serif}
.nstat .k{font-size:10px;color:var(--mut);font-family:-apple-system,sans-serif;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.nstat .v.kc{color:var(--gold)}
.day{margin-bottom:10px}
.dname{font-size:11px;font-weight:700;color:var(--mut);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;font-family:-apple-system,sans-serif}
.slot{width:100%;background:#141414;border:1px dashed #2c2c2c;border-radius:13px;padding:14px;cursor:pointer;color:inherit;display:flex;align-items:center;gap:13px;text-align:left;min-height:64px}
.slot.full{background:var(--bg2);border:1px solid #2c2c2c}
.slot .pl{font-size:24px;color:#3a3a3a;width:100%;text-align:center}
.slot .em{font-size:30px;flex-shrink:0}
.slot .info{flex:1;min-width:0}
.slot .nm{font-weight:600;font-size:15px;line-height:1.25}
.slot .mt{font-size:11px;color:var(--mut);font-family:-apple-system,sans-serif;margin-top:3px;display:flex;gap:9px;flex-wrap:wrap}
.slot .mt b{color:var(--gold);font-weight:700}
.rcard{width:100%;background:var(--bg2);border:1px solid #242424;border-radius:13px;padding:13px;margin-bottom:8px;cursor:pointer;color:inherit;display:flex;align-items:center;gap:12px;text-align:left}
.rcard .em{font-size:27px;flex-shrink:0;width:34px;text-align:center}
.rcard .thumb{width:46px;height:46px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--bg3)}
.rcard .info{flex:1;min-width:0}
.rcard .nm{font-weight:600;font-size:14.5px}
.rcard .mt{font-size:11px;color:var(--mut);font-family:-apple-system,sans-serif;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.rcard .mt b{color:var(--gold);font-weight:700}
.tagmini{font-size:9px;background:var(--bg3);color:var(--mut);border-radius:5px;padding:1px 5px;font-family:-apple-system,sans-serif;letter-spacing:.3px}
.star{background:none;border:none;font-size:18px;cursor:pointer;color:#3a3a3a;padding:4px}
.star.on{color:var(--gold)}
.search{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:14px;outline:none;margin-bottom:10px}
.search::placeholder{color:#555}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.chip{flex-shrink:0;background:var(--bg3);border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:12px;cursor:pointer;color:var(--mut);font-family:-apple-system,sans-serif;white-space:nowrap}
.chip.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
.chip.prot.on{background:var(--grn);border-color:var(--grn)}
.scat{font-size:11px;font-weight:700;color:var(--mut);letter-spacing:1px;text-transform:uppercase;margin:16px 0 7px;font-family:-apple-system,sans-serif}
.sitem{display:flex;align-items:center;gap:12px;padding:11px 13px;background:var(--bg2);border-radius:10px;margin-bottom:5px;cursor:pointer}
.sitem.ck{opacity:.4}
.cb{width:21px;height:21px;border-radius:6px;border:2px solid #333;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#000;font-weight:800}
.cb.on{background:var(--gold);border-color:var(--gold)}
.sname{flex:1;font-size:14px}.sname.cr{text-decoration:line-through;color:#555}
.samt{font-size:13px;color:var(--gold);font-weight:700;font-family:-apple-system,sans-serif}
.empty{text-align:center;padding:48px 20px;color:#555}
.empty .e{font-size:40px;margin-bottom:12px}
.empty .sans{font-size:13px;line-height:1.6}
.btn{background:var(--gold);color:#000;border:none;border-radius:11px;padding:13px;font-weight:700;font-size:14px;cursor:pointer;width:100%;font-family:-apple-system,sans-serif}
.btn.sm{width:auto;padding:7px 14px;border-radius:20px;font-size:12px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--mut)}
.btn.danger{background:none;border:1px solid #3a2424;color:var(--red)}
.btn.add{background:none;border:1px dashed var(--gold);color:var(--gold);margin-bottom:14px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;align-items:flex-end;z-index:100}
.ov.show{display:flex}
.sheet{background:var(--bg2);border-radius:22px 22px 0 0;width:100%;max-height:94vh;overflow-y:auto;padding:20px 18px calc(28px + env(safe-area-inset-bottom));animation:up .28s}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.mhead{display:flex;align-items:flex-start;gap:12px;margin-bottom:4px}
.mhead .em{font-size:38px}
.mhead .ttl{flex:1}
.mhead h2{font-size:20px;font-weight:700;line-height:1.2}
.mhead .sub{font-size:12px;color:var(--mut);font-family:-apple-system,sans-serif;margin-top:4px}
.mclose{background:none;border:none;color:var(--mut);font-size:24px;cursor:pointer;line-height:1}
.port{display:flex;align-items:center;gap:14px;background:var(--bg3);border-radius:13px;padding:10px 14px;margin:16px 0}
.port .pl{font-size:13px;color:var(--mut);font-family:-apple-system,sans-serif;flex:1}
.port .pl b{color:var(--txt);font-size:15px}
.pbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--gold);font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pnum{font-size:18px;font-weight:700;min-width:28px;text-align:center;font-family:-apple-system,sans-serif}
.nutri{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
.ncard{background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:11px 6px;text-align:center}
.ncard .v{font-size:17px;font-weight:700;font-family:-apple-system,sans-serif}
.ncard .v.kc{color:var(--gold)}
.ncard .k{font-size:9.5px;color:var(--mut);font-family:-apple-system,sans-serif;text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.nnote{font-size:10.5px;color:#666;font-family:-apple-system,sans-serif;text-align:center;margin:7px 0 4px}
.ilist{list-style:none;margin:4px 0}
.ilist li{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid #1e1e1e;font-size:14.5px}
.ilist li .a{color:var(--gold);font-weight:700;font-family:-apple-system,sans-serif;white-space:nowrap;padding-left:10px}
.steps{list-style:none;counter-reset:s;margin:4px 0}
.steps li{counter-increment:s;display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #1e1e1e;font-size:14.5px;line-height:1.5}
.steps li::before{content:counter(s);flex-shrink:0;width:26px;height:26px;background:var(--gold);color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;font-family:-apple-system,sans-serif}
.daypick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:6px 0 14px}
.daypick button{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:11px 4px;cursor:pointer;font-size:13px;font-family:-apple-system,sans-serif}
.daypick button.set{border-color:var(--gold);color:var(--gold)}
.act{display:flex;flex-direction:column;gap:9px;margin-top:14px}
/* photo */
.rphoto{width:100%;border-radius:14px;overflow:hidden;margin-bottom:14px;background:var(--bg3)}
.rphoto img{width:100%;display:block;max-height:260px;object-fit:cover}
.rphoto.empty{border:1px dashed var(--line);min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--mut);cursor:pointer;font-family:-apple-system,sans-serif;font-size:13px}
.rphoto .pbar{display:flex;gap:8px;padding:8px}
.rphoto .pbar .btn{flex:1}
/* editor */
.efld{margin-bottom:13px}
.efld>label{display:block;font-size:12px;color:var(--mut);font-family:-apple-system,sans-serif;margin-bottom:6px}
.einp{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;outline:none}
.einp:focus{border-color:var(--gold)}
.erow2{display:flex;gap:10px}
.eing{display:flex;gap:6px;margin-bottom:7px;align-items:center}
.eing .ei-name{flex:1}.eing .ei-amt{width:76px}.eing .ei-unit{width:70px}
.eing textarea.estep{flex:1;min-height:52px;resize:vertical;line-height:1.4}
.ex{background:none;border:none;color:var(--red);font-size:22px;cursor:pointer;padding:0 4px;flex-shrink:0}
.addrow{background:none;border:1px dashed var(--line);color:var(--gold);border-radius:10px;padding:10px;width:100%;cursor:pointer;font-family:-apple-system,sans-serif;font-size:13px;margin-top:2px}
.echk{display:flex;align-items:center;gap:9px;font-family:-apple-system,sans-serif;font-size:13.5px;margin-bottom:6px}
.echk input{width:18px;height:18px;accent-color:var(--gold)}
.emoji-quick{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 8px}
.emoji-quick span{font-size:21px;cursor:pointer;padding:5px;border-radius:9px;background:var(--bg3)}
#cook{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;flex-direction:column;padding:20px 22px calc(20px + env(safe-area-inset-bottom))}
#cook.show{display:flex}
#cook .ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#cook .ch h3{font-size:16px}
#cook .prog{font-size:12px;color:var(--mut);font-family:-apple-system,sans-serif}
#cook .body{flex:1;display:flex;flex-direction:column;justify-content:center}
#cook .sno{font-size:13px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;font-family:-apple-system,sans-serif;margin-bottom:14px}
#cook .stxt{font-size:24px;line-height:1.45}
#cook .nav{display:flex;gap:10px}
#cook .nav button{flex:1;padding:16px;border-radius:13px;border:1px solid var(--line);background:var(--bg2);font-size:15px;cursor:pointer;font-family:-apple-system,sans-serif;font-weight:600}
#cook .nav button.prim{background:var(--gold);color:#000;border-color:var(--gold)}
</style>
</head>

<div id="toast"></div>
<div id="app">

</div>

<script>
"use strict";
var RECIPES = JSON.parse(document.getElementById("recipe-data").textContent);
var DAYS = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
var CATS = ["Pasta","Fleisch","Fisch","Vegetarisch","Suppen & Eint\u00f6pfe","Aufl\u00e4ufe","Reis & Bowls","International"];

function load(k,d){try{var v=localStorage.getItem("mk_"+k);return v?JSON.parse(v):d;}catch(e){return d;}}
function save(k,v){try{localStorage.setItem("mk_"+k,JSON.stringify(v));}catch(e){}}
var plan=load("plan",{}), favs=load("favs",[]), checked=load("checked",{});
var DEFAULT_PORTIONS=load("defport",2);
var overrides=load("overrides",{}), customs=load("customs",{});

/* effective recipe set */
var RMAP_B={}; RECIPES.forEach(function(r){RMAP_B[String(r.id)]=r;});
var RMAP={}, ALL=[];
function getRecipe(id){id=String(id);return customs[id]||overrides[id]||RMAP_B[id]||null;}
function isBuiltin(id){return !!RMAP_B[String(id)];}
function isEdited(id){return !!overrides[String(id)];}
function allRecipes(){var o=[];RECIPES.forEach(function(r){o.push(overrides[String(r.id)]||r);});Object.keys(customs).forEach(function(k){o.push(customs[k]);});return o;}
function rebuildIndex(){ALL=allRecipes();RMAP={};ALL.forEach(function(r){RMAP[String(r.id)]=r;});}
rebuildIndex();

function toast(t){var e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove("show");},1500);}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");}
function fmtAmt(a){a=Math.round(a*10)/10;return (a%1===0)?String(a):String(a).replace(".",",");}

/* ---------- IndexedDB images ---------- */
var DB=null;
function dbOpen(cb){
  if(DB)return cb(DB);
  if(!window.indexedDB)return cb(null);
  try{var rq=indexedDB.open("mittagskueche_img",1);
    rq.onupgradeneeded=function(e){e.target.result.createObjectStore("img");};
    rq.onsuccess=function(e){DB=e.target.result;cb(DB);};
    rq.onerror=function(){cb(null);};
  }catch(e){cb(null);}
}
function imgGet(id,cb){dbOpen(function(db){if(!db)return cb(null);try{var t=db.transaction("img","readonly").objectStore("img").get(String(id));t.onsuccess=function(){cb(t.result||null);};t.onerror=function(){cb(null);};}catch(e){cb(null);}});}
function imgSet(id,data,cb){dbOpen(function(db){if(!db){cb&&cb(false);return;}try{var t=db.transaction("img","readwrite").objectStore("img").put(data,String(id));t.onsuccess=function(){cb&&cb(true);};t.onerror=function(){cb&&cb(false);};}catch(e){cb&&cb(false);}});}
function imgDel(id,cb){dbOpen(function(db){if(!db){cb&&cb();return;}try{var t=db.transaction("img","readwrite").objectStore("img").delete(String(id));t.onsuccess=function(){cb&&cb();};t.onerror=function(){cb&&cb();};}catch(e){cb&&cb();}});}
function chooseImage(cb){
  var inp=document.createElement("input");inp.type="file";inp.accept="image/*";
  inp.onchange=function(){var file=inp.files&&inp.files[0];if(!file){cb(null);return;}
    var fr=new FileReader();
    fr.onload=function(){var img=new Image();
      img.onload=function(){var max=1024,w=img.width,h=img.height;
        if(w>=h&&w>max){h=Math.round(h*max/w);w=max;}else if(h>w&&h>max){w=Math.round(w*max/h);h=max;}
        try{var c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);cb(c.toDataURL("image/jpeg",0.82));}catch(e){cb(fr.result);}};
      img.onerror=function(){cb(fr.result);};img.src=fr.result;};
    fr.readAsDataURL(file);};
  inp.click();
}

/* ---------- views ---------- */
var view="plan";
function switchView(v){view=v;
  ["plan","rec","shop"].forEach(function(x){document.getElementById("v-"+x).classList.toggle("active",x===v);});
  document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("active",b.dataset.v===v);});
  if(v==="plan")renderPlan();if(v==="rec")renderRec();if(v==="shop")renderShop();}
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){switchView(b.dataset.v);};});
function updateBadges(){var pc=Object.keys(plan).length;var nb=document.getElementById("nb-plan");nb.style.display=pc?"block":"none";nb.textContent=pc;
  var items=shoppingItems(),sc=0;Object.keys(items).forEach(function(c){sc+=items[c].length;});var sb=document.getElementById("nb-shop");sb.style.display=sc?"block":"none";sb.textContent=sc;}

/* ---------- PLAN ---------- */
function planTotals(){var t={kcal:0,protein:0,fat:0,carbs:0,count:0};Object.keys(plan).forEach(function(d){var r=RMAP[String(plan[d].id)];if(!r)return;t.count++;t.kcal+=r.nut.kcal;t.protein+=r.nut.protein;t.fat+=r.nut.fat;t.carbs+=r.nut.carbs;});return t;}
function nstat(v,k,cls){return '<div class="nstat"><div class="v '+cls+'">'+v+'</div><div class="k">'+k+'</div></div>';}
function renderPlan(){var el=document.getElementById("v-plan"),h="",t=planTotals();
  if(t.count){h+='<div class="lbl">N\u00e4hrwerte &middot; \u00d8 pro Mahlzeit</div><div class="wsum"><div class="t sans"><span>'+t.count+' von 7 Tagen geplant</span><span>pro Portion</span></div><div class="grid">'+
    nstat(Math.round(t.kcal/t.count),"kcal","kc")+nstat(Math.round(t.protein/t.count)+"g","Eiwei\u00df","")+nstat(Math.round(t.fat/t.count)+"g","Fett","")+nstat(Math.round(t.carbs/t.count)+"g","Kohlenh.","")+'</div></div>';}
  h+='<div class="lbl">Mittagessen der Woche</div>';
  for(var i=0;i<7;i++){var e=plan[i],r=e?RMAP[String(e.id)]:null;h+='<div class="day"><div class="dname">'+DAYS[i]+'</div>';
    if(r){h+='<button class="slot full" onclick="openSlot('+i+')"><span class="em">'+r.emoji+'</span><div class="info"><div class="nm">'+esc(r.name)+'</div><div class="mt sans"><span>&#x1F465; '+e.portions+' Port.</span><span><b>'+r.nut.kcal+'</b> kcal</span><span><b>'+r.nut.protein+'g</b> Eiwei\u00df</span></div></div></button>';}
    else{h+='<button class="slot" onclick="openPicker('+i+')"><span class="pl">+</span></button>';}
    h+='</div>';}
  el.innerHTML=h;updateBadges();}

/* ---------- RECIPES ---------- */
var recFilter={q:"",cat:"",prot:false,fav:false};
function renderRec(){var el=document.getElementById("v-rec"),h="";
  h+='<button class="btn add" onclick="openEditor()">+ Eigenes Gericht hinzuf\u00fcgen</button>';
  h+='<input class="search" id="rsearch" placeholder="Rezept suchen\u2026" value="'+esc(recFilter.q)+'">';
  h+='<div class="chips"><div class="chip prot'+(recFilter.prot?" on":"")+'" onclick="toggleProt()">\u2728 Viel Eiwei\u00df</div>'+
     '<div class="chip'+(recFilter.fav?" on":"")+'" onclick="toggleFav()">\u2605 Favoriten</div>'+
     '<div class="chip'+(recFilter.cat===""?" on":"")+'" onclick="setCat(\'\')">Alle</div>';
  CATS.forEach(function(c){h+='<div class="chip'+(recFilter.cat===c?" on":"")+'" onclick="setCat(\''+c.replace(/'/g,"\\'")+'\')">'+c+'</div>';});
  h+='</div>';
  var list=ALL.filter(function(r){
    if(recFilter.cat&&r.cat!==recFilter.cat)return false;
    if(recFilter.prot&&(r.tags||[]).indexOf("high-protein")<0)return false;
    if(recFilter.fav&&favs.indexOf(r.id)<0&&favs.indexOf(String(r.id))<0)return false;
    if(recFilter.q&&r.name.toLowerCase().indexOf(recFilter.q.toLowerCase())<0)return false;return true;});
  list.sort(function(a,b){return a.name.localeCompare(b.name,"de");});
  h+='<div class="sans" style="font-size:12px;color:#666;margin-bottom:10px">'+list.length+' Gerichte</div>';
  if(!list.length)h+='<div class="empty"><div class="e">\u{1F50D}</div><div class="sans">Keine Treffer.</div></div>';
  list.forEach(function(r){var fav=favs.indexOf(r.id)>=0||favs.indexOf(String(r.id))>=0;
    var custom=!isBuiltin(r.id), edited=isEdited(r.id);
    h+='<div class="rcard" onclick="openRecipe(\''+r.id+'\')"><img class="thumb" id="th-'+r.id+'" style="display:none"><span class="em" id="em-'+r.id+'">'+r.emoji+'</span><div class="info"><div class="nm">'+esc(r.name)+(custom?' <span class="tagmini">eigenes</span>':(edited?' <span class="tagmini">bearbeitet</span>':''))+'</div>'+
       '<div class="mt sans"><span>'+r.cat+'</span><span>&#x23F1; '+r.time+' Min</span><span><b>'+r.nut.kcal+'</b> kcal</span><span><b>'+r.nut.protein+'g</b> EW</span></div></div>'+
       '<button class="star'+(fav?" on":"")+'" onclick="event.stopPropagation();toggleStar(\''+r.id+'\')">'+(fav?"\u2605":"\u2606")+'</button></div>';});
  el.innerHTML=h;
  /* lazy load thumbnails */
  list.forEach(function(r){imgGet(r.id,function(d){if(!d)return;var th=document.getElementById("th-"+r.id),em=document.getElementById("em-"+r.id);if(th){th.src=d;th.style.display="block";}if(em)em.style.display="none";});});
  var s=document.getElementById("rsearch");s.oninput=function(){recFilter.q=s.value;var p=s.selectionStart;renderRec();var ns=document.getElementById("rsearch");ns.focus();try{ns.setSelectionRange(p,p);}catch(e){}};}
function setCat(c){recFilter.cat=c;renderRec();}
function toggleProt(){recFilter.prot=!recFilter.prot;renderRec();}
function toggleFav(){recFilter.fav=!recFilter.fav;renderRec();}
function toggleStar(id){var i=favs.indexOf(id);if(i<0)i=favs.indexOf(String(id));if(i>=0)favs.splice(i,1);else favs.push(id);save("favs",favs);if(view==="rec")renderRec();}

/* ---------- DETAIL ---------- */
var sheetState={id:null,portions:2,targetDay:null};
function openRecipe(id,targetDay){var r=getRecipe(id);if(!r)return;
  sheetState={id:r.id,portions:DEFAULT_PORTIONS,targetDay:(targetDay==null?null:targetDay)};
  if(targetDay!=null&&plan[targetDay])sheetState.portions=plan[targetDay].portions;
  renderSheet();document.getElementById("ov").classList.add("show");}
function renderSheet(){var r=getRecipe(sheetState.id),p=sheetState.portions,f=p/r.base;
  var tag=!isBuiltin(r.id)?' &middot; eigenes Gericht':(isEdited(r.id)?' &middot; bearbeitet':'');
  var h='<div class="mhead"><span class="em">'+r.emoji+'</span><div class="ttl"><h2>'+esc(r.name)+'</h2><div class="sub">'+r.cat+' &middot; &#x23F1; '+r.time+' Min'+(favs.indexOf(r.id)>=0||favs.indexOf(String(r.id))>=0?' &middot; \u2605':'')+tag+'</div></div><button class="mclose" onclick="closeSheet()">&times;</button></div>';
  h+='<div id="r-photo" class="rphoto empty"></div>';
  h+='<div class="port"><span class="pl sans">Portionen: <b>'+p+'</b></span><button class="pbtn" onclick="changePort(-1)">&minus;</button><span class="pnum">'+p+'</span><button class="pbtn" onclick="changePort(1)">+</button></div>';
  h+='<div class="lbl">N\u00e4hrwerte pro Portion</div><div class="nutri">'+ncard(r.nut.kcal,"kcal","kc")+ncard(r.nut.protein+"g","Eiwei\u00df","")+ncard(r.nut.fat+"g","Fett","")+ncard(r.nut.carbs+"g","Kohlenh.","")+'</div>';
  h+='<div class="nnote sans">Gesamt f\u00fcr '+p+' Portionen: ca. '+(r.nut.kcal*p)+' kcal &middot; Werte sind Sch\u00e4tzungen</div>';
  h+='<div class="lbl">Zutaten</div><ul class="ilist">';
  r.ings.forEach(function(ig){h+='<li><span>'+esc(ig.name)+'</span><span class="a">'+fmtAmt(ig.amount*f)+(ig.unit?(" "+esc(ig.unit)):"")+'</span></li>';});
  h+='</ul>';
  if(r.steps&&r.steps.length){h+='<div class="lbl">Zubereitung</div><ul class="steps">';r.steps.forEach(function(s){h+='<li>'+esc(s)+'</li>';});h+='</ul>';}
  h+='<div class="act">';
  if(r.steps&&r.steps.length)h+='<button class="btn" onclick="startCook()">\u{1F468}\u200D\u{1F373} Kochmodus starten</button>';
  if(sheetState.targetDay!=null){h+='<button class="btn ghost" onclick="assignDay('+sheetState.targetDay+')">In \u201E'+DAYS[sheetState.targetDay]+'\u201C \u00fcbernehmen</button>';}
  else{h+='<div class="lbl" style="margin-bottom:6px">Zum Wochenplan</div><div class="daypick">';for(var i=0;i<7;i++){var setd=plan[i]&&String(plan[i].id)===String(r.id);h+='<button class="'+(setd?"set":"")+'" onclick="assignDay('+i+')">'+DAYS[i].slice(0,2)+'</button>';}h+='</div>';}
  h+='<button class="btn ghost" onclick="editCurrent()">\u270E Gericht bearbeiten</button>';
  h+='<button class="btn ghost" onclick="toggleStar(\''+r.id+'\');renderSheet()">'+(favs.indexOf(r.id)>=0||favs.indexOf(String(r.id))>=0?"\u2605 Favorit entfernen":"\u2606 Als Favorit merken")+'</button>';
  h+='</div>';
  document.getElementById("sheet").innerHTML=h;
  loadPhoto(r.id,false);}
function ncard(v,k,cls){return '<div class="ncard"><div class="v '+cls+'">'+v+'</div><div class="k">'+k+'</div></div>';}
function changePort(d){sheetState.portions=Math.max(1,Math.min(12,sheetState.portions+d));DEFAULT_PORTIONS=sheetState.portions;save("defport",DEFAULT_PORTIONS);renderSheet();}
function assignDay(i){plan[i]={id:sheetState.id,portions:sheetState.portions};save("plan",plan);closeSheet();toast(DAYS[i]+": "+getRecipe(sheetState.id).name);if(view==="plan")renderPlan();else updateBadges();}
function closeSheet(){document.getElementById("ov").classList.remove("show");}
document.getElementById("ov").onclick=function(e){if(e.target.id==="ov")closeSheet();};
function editCurrent(){openEditor(sheetState.id);}

/* ---------- PHOTO (detail + editor share this) ---------- */
function loadPhoto(id){imgGet(id,function(data){var c=document.getElementById("r-photo");if(!c)return;
  if(data){c.className="rphoto";c.onclick=null;c.innerHTML='<img src="'+data+'"><div class="pbar"><button class="btn ghost sm" onclick="changePhoto(\''+id+'\')">Foto \u00e4ndern</button><button class="btn danger sm" onclick="removePhoto(\''+id+'\')">Entfernen</button></div>';}
  else{c.className="rphoto empty";c.onclick=function(){changePhoto(id);};c.innerHTML='<div style="font-size:30px">\u{1F4F7}</div><div>Foto hinzuf\u00fcgen</div>';}});}
function changePhoto(id){chooseImage(function(data){if(!data)return;imgSet(id,data,function(){loadPhoto(id);if(view==="rec")renderRec();});});}
function removePhoto(id){imgDel(id,function(){loadPhoto(id);if(view==="rec")renderRec();});}

/* ---------- PICKER & SLOT ---------- */
function openPicker(day){var h='<div class="mhead"><div class="ttl"><h2>'+DAYS[day]+'</h2><div class="sub">Gericht ausw\u00e4hlen</div></div><button class="mclose" onclick="closeSheet()">&times;</button></div>';
  h+='<input class="search" id="psearch" placeholder="Suchen\u2026"><div id="plist"></div>';
  document.getElementById("sheet").innerHTML=h;document.getElementById("ov").classList.add("show");
  var s=document.getElementById("psearch");
  function fill(){var q=s.value.toLowerCase(),hh="";var list=ALL.filter(function(r){return !q||r.name.toLowerCase().indexOf(q)>=0;});
    var byCat={};list.forEach(function(r){(byCat[r.cat]=byCat[r.cat]||[]).push(r);});
    CATS.forEach(function(c){if(!byCat[c])return;byCat[c].sort(function(a,b){return a.name.localeCompare(b.name,"de");});hh+='<div class="lbl">'+c+'</div>';
      byCat[c].forEach(function(r){hh+='<div class="rcard" onclick="openRecipe(\''+r.id+'\','+day+')"><span class="em">'+r.emoji+'</span><div class="info"><div class="nm">'+esc(r.name)+'</div><div class="mt sans"><span>&#x23F1; '+r.time+' Min</span><span><b>'+r.nut.kcal+'</b> kcal</span><span><b>'+r.nut.protein+'g</b> EW</span></div></div></div>';});});
    document.getElementById("plist").innerHTML=hh;}
  fill();s.oninput=fill;}
function openSlot(day){var r=RMAP[String(plan[day].id)];if(!r){clearDay(day);return;}
  var h='<div class="mhead"><span class="em">'+r.emoji+'</span><div class="ttl"><h2>'+esc(r.name)+'</h2><div class="sub">'+DAYS[day]+' &middot; '+plan[day].portions+' Portionen</div></div><button class="mclose" onclick="closeSheet()">&times;</button></div>';
  h+='<div class="act"><button class="btn" onclick="openRecipe(\''+r.id+'\','+day+')">Rezept ansehen &amp; kochen</button><button class="btn ghost" onclick="openPicker('+day+')">Anderes Gericht w\u00e4hlen</button><button class="btn danger" onclick="clearDay('+day+')">Vom Plan entfernen</button></div>';
  document.getElementById("sheet").innerHTML=h;document.getElementById("ov").classList.add("show");}
function clearDay(day){delete plan[day];save("plan",plan);closeSheet();renderPlan();}

/* ---------- COOK MODE ---------- */
var cookState={steps:[],i:0,wake:null};
function startCook(){var r=getRecipe(sheetState.id);cookState={steps:r.steps,i:0,wake:null};document.getElementById("cook-title").textContent=r.emoji+" "+r.name;closeSheet();document.getElementById("cook").classList.add("show");
  if(navigator.wakeLock){navigator.wakeLock.request("screen").then(function(w){cookState.wake=w;}).catch(function(){});}renderCook();}
function renderCook(){var n=cookState.steps.length,i=cookState.i;document.getElementById("cook-prog").textContent="Schritt "+(i+1)+" von "+n;document.getElementById("cook-sno").textContent="Schritt "+(i+1);document.getElementById("cook-stxt").textContent=cookState.steps[i];document.getElementById("cook-prev").style.visibility=i===0?"hidden":"visible";document.getElementById("cook-next").textContent=(i===n-1)?"Fertig \u2713":"Weiter \u2192";}
function cookStep(d){var n=cookState.steps.length;if(d>0&&cookState.i===n-1){closeCook();toast("Guten Appetit! \u{1F37D}\uFE0F");return;}cookState.i=Math.max(0,Math.min(n-1,cookState.i+d));renderCook();}
function closeCook(){document.getElementById("cook").classList.remove("show");if(cookState.wake){try{cookState.wake.release();}catch(e){}cookState.wake=null;}}

/* ---------- EDITOR ---------- */
var editState=null;
var EMOJIS=["\u{1F35D}","\u{1F356}","\u{1F357}","\u{1F41F}","\u{1F963}","\u{1F372}","\u{1F35B}","\u{1F955}","\u{1F9C0}","\u{1F954}","\u{1F35A}","\u{1F32E}","\u{1F355}","\u{1F37D}\uFE0F","\u{1F950}","\u{1F33F}"];
function openEditor(id){
  if(id==null||id===undefined){editState={id:"c"+Date.now(),isNew:true,builtin:false,name:"",emoji:"\u{1F37D}\uFE0F",cat:CATS[0],base:DEFAULT_PORTIONS,time:30,prot:false,ings:[{name:"",amount:0,unit:""}],steps:[""],nut:{kcal:0,protein:0,fat:0,carbs:0}};}
  else{var r=getRecipe(id);editState={id:r.id,isNew:false,builtin:isBuiltin(r.id),name:r.name,emoji:r.emoji,cat:r.cat,base:r.base,time:r.time,prot:(r.tags||[]).indexOf("high-protein")>=0,ings:r.ings.map(function(i){return {name:i.name,amount:i.amount,unit:i.unit};}),steps:(r.steps||[]).slice(),nut:{kcal:r.nut.kcal,protein:r.nut.protein,fat:r.nut.fat,carbs:r.nut.carbs}};}
  renderEditor();document.getElementById("ov").classList.add("show");}
function gv(id){var e=document.getElementById(id);return e?e.value:"";}
function gnum(id){var e=document.getElementById(id);return e?(parseFloat((e.value||"").replace(",","."))||0):0;}
function captureEditForm(filter){var f=editState;
  f.name=gv("e-name");f.emoji=gv("e-emoji").trim()||"\u{1F37D}\uFE0F";f.cat=gv("e-cat");
  f.base=parseInt(gv("e-base"))||1;f.time=parseInt(gv("e-time"))||0;
  var pc=document.getElementById("e-prot");if(pc)f.prot=pc.checked;
  f.nut={kcal:Math.round(gnum("e-kcal")),protein:Math.round(gnum("e-pg")),fat:Math.round(gnum("e-fat")),carbs:Math.round(gnum("e-carbs"))};
  var ings=[];document.querySelectorAll(".eing-ing").forEach(function(row){var nm=row.querySelector(".ei-name").value,am=row.querySelector(".ei-amt").value,un=row.querySelector(".ei-unit").value;if(filter&&!nm.trim())return;ings.push({name:nm,amount:parseFloat((am||"").replace(",","."))||0,unit:un});});
  f.ings=ings.length?ings:(filter?[]:[{name:"",amount:0,unit:""}]);
  var steps=[];document.querySelectorAll(".estep").forEach(function(t){if(filter&&!t.value.trim())return;steps.push(t.value);});
  f.steps=steps;}
function setEmoji(e){captureEditForm(false);editState.emoji=e;renderEditor();}
function addIng(){captureEditForm(false);editState.ings.push({name:"",amount:0,unit:""});renderEditor();}
function rmIng(i){captureEditForm(false);editState.ings.splice(i,1);if(!editState.ings.length)editState.ings.push({name:"",amount:0,unit:""});renderEditor();}
function addStep(){captureEditForm(false);editState.steps.push("");renderEditor();}
function rmStep(i){captureEditForm(false);editState.steps.splice(i,1);if(!editState.steps.length)editState.steps.push("");renderEditor();}
function renderEditor(){var f=editState;
  var h='<div class="mhead"><div class="ttl"><h2>'+(f.isNew?"Neues Gericht":"Gericht bearbeiten")+'</h2><div class="sub">Eigene Angaben \u2013 jederzeit \u00e4nderbar</div></div><button class="mclose" onclick="closeSheet()">&times;</button></div>';
  h+='<div id="r-photo" class="rphoto empty"></div>';
  h+='<div class="efld"><label>Name</label><input id="e-name" class="einp" value="'+esc(f.name)+'" placeholder="z.B. Omas Gulasch"></div>';
  h+='<div class="erow2"><div class="efld" style="width:96px"><label>Emoji</label><input id="e-emoji" class="einp" value="'+esc(f.emoji)+'" maxlength="4"></div><div class="efld" style="flex:1"><label>Kategorie</label><select id="e-cat" class="einp">'+CATS.map(function(c){return '<option'+(c===f.cat?" selected":"")+'>'+c+'</option>';}).join("")+'</select></div></div>';
  h+='<div class="emoji-quick">'+EMOJIS.map(function(e){return '<span onclick="setEmoji(\''+e+'\')">'+e+'</span>';}).join("")+'</div>';
  h+='<div class="erow2"><div class="efld" style="flex:1"><label>Standard-Portionen</label><input id="e-base" class="einp" type="number" inputmode="numeric" min="1" value="'+f.base+'"></div><div class="efld" style="flex:1"><label>Zeit (Min)</label><input id="e-time" class="einp" type="number" inputmode="numeric" min="0" value="'+f.time+'"></div></div>';
  h+='<div class="lbl">N\u00e4hrwerte pro Portion</div>';
  h+='<div class="erow2"><div class="efld" style="flex:1"><label>kcal</label><input id="e-kcal" class="einp" type="number" inputmode="numeric" value="'+f.nut.kcal+'"></div><div class="efld" style="flex:1"><label>Eiwei\u00df (g)</label><input id="e-pg" class="einp" type="number" inputmode="numeric" value="'+f.nut.protein+'"></div></div>';
  h+='<div class="erow2"><div class="efld" style="flex:1"><label>Fett (g)</label><input id="e-fat" class="einp" type="number" inputmode="numeric" value="'+f.nut.fat+'"></div><div class="efld" style="flex:1"><label>Kohlenh. (g)</label><input id="e-carbs" class="einp" type="number" inputmode="numeric" value="'+f.nut.carbs+'"></div></div>';
  h+='<label class="echk"><input type="checkbox" id="e-prot"'+(f.prot?" checked":"")+'> Als proteinreich markieren (\u2728-Filter)</label>';
  h+='<div class="lbl">Zutaten (f\u00fcr '+f.base+' Portionen)</div>';
  f.ings.forEach(function(ig,idx){h+='<div class="eing eing-ing"><input class="einp ei-name" value="'+esc(ig.name)+'" placeholder="Zutat"><input class="einp ei-amt" inputmode="decimal" value="'+(ig.amount?fmtAmt(ig.amount):"")+'" placeholder="Menge"><input class="einp ei-unit" value="'+esc(ig.unit)+'" placeholder="Einh."><button class="ex" onclick="rmIng('+idx+')">&times;</button></div>';});
  h+='<button class="addrow" onclick="addIng()">+ Zutat</button>';
  h+='<div class="lbl">Zubereitung</div>';
  f.steps.forEach(function(s,idx){h+='<div class="eing"><textarea class="einp estep" placeholder="Schritt '+(idx+1)+'\u2026">'+esc(s)+'</textarea><button class="ex" onclick="rmStep('+idx+')">&times;</button></div>';});
  h+='<button class="addrow" onclick="addStep()">+ Schritt</button>';
  h+='<div class="act"><button class="btn" onclick="saveRecipe()">Speichern</button>';
  if(!f.isNew){if(f.builtin&&isEdited(f.id))h+='<button class="btn ghost" onclick="resetBuiltin('+f.id+')">Original wiederherstellen</button>';
    if(!f.builtin)h+='<button class="btn danger" onclick="deleteCustom(\''+f.id+'\')">Gericht l\u00f6schen</button>';}
  h+='</div>';
  document.getElementById("sheet").innerHTML=h;
  loadPhoto(f.id);}
function saveRecipe(){captureEditForm(true);var f=editState;
  if(!f.name.trim()){toast("Bitte einen Namen eingeben");return;}
  var rec={id:f.id,name:f.name.trim(),emoji:f.emoji,cat:f.cat,base:f.base,time:f.time,
    ings:f.ings.map(function(i){return {name:i.name.trim(),amount:i.amount,unit:(i.unit||"").trim()};}).filter(function(i){return i.name;}),
    steps:f.steps.map(function(s){return s.trim();}).filter(Boolean),nut:f.nut,tags:f.prot?["high-protein"]:[]};
  if(f.builtin){overrides[String(f.id)]=rec;save("overrides",overrides);}else{customs[String(f.id)]=rec;save("customs",customs);}
  rebuildIndex();closeSheet();toast("Gespeichert");
  if(view==="rec")renderRec();else if(view==="plan")renderPlan();
  openRecipe(f.id);}
function deleteCustom(id){if(!window.confirm("Dieses Gericht wirklich l\u00f6schen?"))return;
  delete customs[id];save("customs",customs);
  Object.keys(plan).forEach(function(d){if(String(plan[d].id)===String(id))delete plan[d];});save("plan",plan);
  imgDel(id);rebuildIndex();closeSheet();toast("Gel\u00f6scht");if(view==="rec")renderRec();else renderPlan();}
function resetBuiltin(id){delete overrides[String(id)];save("overrides",overrides);rebuildIndex();closeSheet();toast("Original wiederhergestellt");if(view==="rec")renderRec();openRecipe(id);}

/* ---------- SHOPPING ---------- */
var ICAT=[
 ["Obst & Gem\u00fcse",["kartoffel","zwiebel","knoblauch","paprika","zucchini","m\u00f6hre","tomate","kirschtomaten","lauch","spinat","champignon","pilz","avocado","zitrone","limette","ingwer","k\u00fcrbis","salat","basilikum","schnittlauch","dill","apfelmus","mais","bohnen","erbsen"]],
 ["Fleisch & Fisch",["hack","fleisch","h\u00e4hnchen","schnitzel","gyros","speck","schinken","wurst","lachs","fisch","backfisch","filet","pancetta","salami","bratwurst","medaillon"]],
 ["Molkerei & K\u00fchl",["sahne","milch","butter","k\u00e4se","parmesan","mozzarella","feta","frischk\u00e4se","cr\u00e8me","schmand","quark","ei","schmelzk\u00e4se","bergk\u00e4se","tortellini","gnocchi","sp\u00e4tzle"]],
 ["Vorrat & Trocken",["pasta","spaghetti","nudel","reis","mehl","paniermehl","br\u00f6tchen","tortilla","brot","kokosmilch","tomaten (dose)","tomaten (passiert)","tomatenmark","tomatensauce","pesto","sojasauce","bbq","remoulade","ketchup","mayonnaise","br\u00fche","hefe","glasnudeln","pommes","r\u00f6sti","bl\u00e4tterteig","pizzateig","flammkuchenteig","schlemmerfilet","chicken nuggets","pelmeni","risottoreis","bandnudeln","wein","\u00f6l","gew\u00fcrz","pulver","paste","masala","tzatziki","oregano","rosmarin","honig","senf","currypaste"]]
];
function catFor(name){var n=name.toLowerCase();for(var c=0;c<ICAT.length;c++){var ks=ICAT[c][1];for(var k=0;k<ks.length;k++)if(n.indexOf(ks[k])>=0)return ICAT[c][0];}return "Sonstiges";}
function shoppingItems(){var agg={};Object.keys(plan).forEach(function(d){var e=plan[d],r=RMAP[String(e.id)];if(!r)return;var f=e.portions/r.base;r.ings.forEach(function(ig){var key=ig.name+"|"+ig.unit;if(!agg[key])agg[key]={name:ig.name,unit:ig.unit,amount:0,key:key};agg[key].amount+=ig.amount*f;});});
  var byCat={};Object.keys(agg).forEach(function(k){var it=agg[k],c=catFor(it.name);(byCat[c]=byCat[c]||[]).push(it);});
  Object.keys(byCat).forEach(function(c){byCat[c].sort(function(a,b){return a.name.localeCompare(b.name,"de");});});return byCat;}
function renderShop(){var el=document.getElementById("v-shop"),h="",items=shoppingItems();
  var order=["Obst & Gem\u00fcse","Fleisch & Fisch","Molkerei & K\u00fchl","Vorrat & Trocken","Sonstiges"];
  var total=0;order.forEach(function(c){if(items[c])total+=items[c].length;});
  if(!total){el.innerHTML='<div class="empty"><div class="e">\u{1F6D2}</div><div class="sans">Noch nichts geplant.<br>F\u00fcge im Wochenplan Gerichte hinzu \u2013 die Zutaten landen automatisch hier.</div></div>';updateBadges();return;}
  var done=0;order.forEach(function(c){if(items[c])items[c].forEach(function(it){if(checked[it.key])done++;});});
  h+='<div class="shead" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><div class="lbl" style="margin:0">Einkaufsliste &middot; '+done+'/'+total+'</div><button class="btn ghost sm" onclick="resetChecks()">Haken zur\u00fccksetzen</button></div>';
  var col={"Obst & Gem\u00fcse":"#86c98a","Fleisch & Fisch":"#e88a8a","Molkerei & K\u00fchl":"#8ab6e8","Vorrat & Trocken":"#e8c87a","Sonstiges":"#888"};
  order.forEach(function(c){if(!items[c])return;h+='<div class="scat" style="display:flex;align-items:center;gap:8px"><span style="width:9px;height:9px;border-radius:50%;background:'+col[c]+'"></span>'+c+'</div>';
    items[c].forEach(function(it){var ck=!!checked[it.key];h+='<div class="sitem'+(ck?" ck":"")+'" onclick="toggleCheck(\''+it.key.replace(/\\/g,"\\\\").replace(/'/g,"\\'")+'\')"><span class="cb'+(ck?" on":"")+'">'+(ck?"\u2713":"")+'</span><span class="sname'+(ck?" cr":"")+'">'+esc(it.name)+'</span><span class="samt">'+fmtAmt(it.amount)+(it.unit?(" "+esc(it.unit)):"")+'</span></div>';});});
  el.innerHTML=h;updateBadges();}
function toggleCheck(key){checked[key]=!checked[key];if(!checked[key])delete checked[key];save("checked",checked);renderShop();}
function resetChecks(){checked={};save("checked",checked);renderShop();}

renderPlan();
</script>
</body>
